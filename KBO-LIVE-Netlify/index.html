<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KBO LIVE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#101828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.82);backdrop-filter:blur(18px);border-bottom:1px solid #e5e7eb}
.wrap{max-width:1100px;margin:auto;padding:18px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:25px;font-weight:900;letter-spacing:-1px}.live{font-size:12px;background:#111827;color:#fff;border-radius:999px;padding:7px 10px}
.tabs{display:flex;gap:8px;margin-top:16px;overflow:auto}.tab{border:0;background:#eef1f5;border-radius:12px;padding:10px 15px;font-weight:700;white-space:nowrap}.tab.on{background:#111827;color:white}
h1{font-size:28px;margin:24px 0 6px}.sub{color:#667085;margin-bottom:18px}.grid{display:grid;grid-template-columns:1.4fr .9fr;gap:18px}
.card{background:#fff;border:1px solid #e7eaf0;border-radius:20px;padding:18px;box-shadow:0 8px 25px rgba(16,24,40,.05);margin-bottom:14px}
.game{cursor:pointer;transition:.15s}.game:hover{transform:translateY(-2px)}.status{font-size:12px;font-weight:800;color:#667085;margin-bottom:15px}.status.live{display:inline-block;background:#e5484d;color:white;padding:5px 8px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:12px}.team b{display:block;font-size:18px}.score{font-size:28px;font-weight:900;margin-top:5px}.vs{color:#98a2b3;font-weight:800}.meta{margin-top:15px;color:#667085;font-size:13px;text-align:center}
.rank-row{display:grid;grid-template-columns:35px 1fr 45px 45px 45px;align-items:center;padding:12px 4px;border-bottom:1px solid #f0f1f3;font-size:13px}.rank-row:first-of-type{font-weight:800}.rank-head{color:#98a2b3;font-size:11px}
.detail{display:none}.detail.show{display:block}.back{border:0;background:#eef1f5;border-radius:10px;padding:9px 12px;font-weight:700;margin-bottom:12px}
.loading,.empty,.error{text-align:center;padding:35px;color:#667085}.error{color:#b42318}
@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:14px}h1{font-size:24px}.card{border-radius:16px}.rank-row{grid-template-columns:28px 1fr 38px 38px 38px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="nav"><div class="logo">KBO LIVE</div><div class="live">● LIVE DATA</div></div><div class="tabs"><button class="tab on" data-tab="games">오늘 경기</button><button class="tab" data-tab="standings">순위</button></div></div></header>
<main class="wrap">
<section id="gamesPage"><h1>오늘의 KBO</h1><div class="sub" id="dateLabel">불러오는 중…</div><div id="games" class="loading">경기 정보를 불러오는 중…</div></section>
<section id="standingsPage" style="display:none"><h1>KBO 순위</h1><div class="sub" id="seasonLabel"></div><div class="card"><div class="rank-row rank-head"><span>순위</span><span>팀</span><span>승</span><span>패</span><span>무</span></div><div id="standings" class="loading">순위를 불러오는 중…</div></div></section>
<section id="detailPage" class="detail"></section>
</main>
<script>
const $=s=>document.querySelector(s);
const state={games:[]};
function koreaDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
async function api(path){const r=await fetch('/.netlify/functions/kbo?path='+encodeURIComponent(path));if(!r.ok)throw Error('API '+r.status);const j=await r.json();if(j.error)throw Error(j.error);return j.result}
async function loadGames(){
  try{
    const d=koreaDate(); $('#dateLabel').textContent=d.replaceAll('-','.')+' · 5초마다 자동 갱신';
    const r=await api(`/schedule/games?upperCategoryId=kbaseball&fromDate=${d}&toDate=${d}`);
    state.games=(r.games||[]).filter(x=>x.homeTeamName&&x.awayTeamName);
    renderGames();
  }catch(e){$('#games').innerHTML='<div class="error">경기 데이터를 불러오지 못했습니다.<br><small>'+e.message+'</small></div>'}
}
function status(g){const s=String(g.statusCode||'').toUpperCase();if(s.includes('START')||s==='LIVE')return '<span class="status live">● LIVE</span>';if(s.includes('RESULT')||s.includes('END'))return '<span class="status">경기 종료</span>';return '<span class="status">경기 예정</span>'}
function renderGames(){
 const el=$('#games'); if(!state.games.length){el.innerHTML='<div class="card empty">오늘 예정된 경기가 없습니다.</div>';return}
 el.innerHTML=state.games.map((g,i)=>`<article class="card game" onclick="detail('${g.gameId}')">${status(g)}<div class="teams"><div class="team"><b>${g.awayTeamName}</b><div class="score">${g.awayScore??'-'}</div></div><div class="vs">VS</div><div class="team"><b>${g.homeTeamName}</b><div class="score">${g.homeScore??'-'}</div></div></div><div class="meta">${g.stadium||''} ${g.startTime?'· '+g.startTime:''}</div></article>`).join('')
}
async function loadStandings(){
 try{const year=new Date().getFullYear();$('#seasonLabel').textContent=year+' 시즌';const r=await api(`/statistics/categories/kbo/seasons/${year}/teams`);const a=r.seasonTeamStats||r.teams||[];$('#standings').innerHTML=a.map((x,i)=>`<div class="rank-row"><span>${x.rank??i+1}</span><span><b>${x.teamName||x.name||'-'}</b></span><span>${x.wins??x.win??'-'}</span><span>${x.losses??x.loss??'-'}</span><span>${x.draws??x.draw??'-'}</span></div>`).join('')||'<div class="empty">순위 데이터가 없습니다.</div>'}catch(e){$('#standings').innerHTML='<div class="error">순위 데이터를 불러오지 못했습니다.</div>'}
}
async function detail(id){
 $('#gamesPage').style.display='none';$('#standingsPage').style.display='none';$('#detailPage').className='detail show';$('#detailPage').innerHTML='<button class="back" onclick="back()">← 경기 목록</button><div class="card loading">경기 상세 정보를 불러오는 중…</div>';
 try{const r=await api(`/schedule/games/${id}`);const g=r.game||r;let relay=null;try{relay=await api(`/schedule/games/${id}/relay`)}catch(_){}
 $('#detailPage').innerHTML='<button class="back" onclick="back()">← 경기 목록</button><div class="card"><h2>'+ (g.awayTeamName||'원정') +' '+(g.awayScore??'-')+' : '+(g.homeScore??'-')+' '+(g.homeTeamName||'홈')+'</h2><p class="sub">'+(g.stadium||'')+'</p><hr><p>경기 상태: '+(g.statusCode||'-')+'</p><p>실시간 데이터: '+(relay?'연결됨':'현재 제공되지 않음')+'</p></div>'}catch(e){$('#detailPage').innerHTML='<button class="back" onclick="back()">← 경기 목록</button><div class="card error">상세 정보를 불러오지 못했습니다.</div>'}
}
function back(){$('#detailPage').className='detail';$('#gamesPage').style.display='block';}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');const t=b.dataset.tab;$('#gamesPage').style.display=t==='games'?'block':'none';$('#standingsPage').style.display=t==='standings'?'block':'none';$('#detailPage').className='detail';if(t==='standings')loadStandings()});
loadGames();setInterval(loadGames,5000);
</script>
</body>
</html>
