<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KBO LIVE</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:16px}.top{position:sticky;top:0;background:#fffdfd;backdrop-filter:blur(15px);border-bottom:1px solid #e5e7eb;z-index:5}.nav{display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:900}.pill{font-size:12px;background:#111827;color:#fff;padding:7px 10px;border-radius:99px}.tabs{display:flex;gap:8px;margin-top:14px}.tab{border:0;border-radius:12px;padding:10px 15px;font-weight:800}.on{background:#111827;color:#fff}h1{margin:24px 0 5px}.sub{color:#667085;margin:0 0 16px}.card{background:#fff;border:1px solid #e6e8ed;border-radius:18px;padding:17px;margin-bottom:13px;box-shadow:0 6px 22px #00000008}.game{cursor:pointer}.status{font-size:12px;font-weight:800;color:#667085;margin-bottom:12px}.live{display:inline-block;background:#e5484d;color:white;border-radius:7px;padding:5px 8px}.teams{display:grid;grid-template-columns:1fr auto 1fr;text-align:center;align-items:center;gap:10px}.team b{font-size:18px}.score{font-size:29px;font-weight:900;margin-top:4px}.vs{color:#98a2b3;font-weight:800}.meta{text-align:center;color:#667085;font-size:12px;margin-top:12px}.rank{width:100%;border-collapse:collapse}.rank th,.rank td{padding:11px 5px;border-bottom:1px solid #eef0f3;text-align:center;font-size:13px}.rank th:nth-child(2),.rank td:nth-child(2){text-align:left}.back{border:0;border-radius:10px;padding:9px 12px;font-weight:800}.error{color:#b42318;text-align:center;padding:25px}.empty{text-align:center;color:#667085;padding:25px}@media(max-width:600px){.wrap{padding:13px}.rank th,.rank td{font-size:11px;padding:9px 2px}.rank th:nth-child(1),.rank td:nth-child(1){width:30px}.rank th:nth-child(n+3),.rank td:nth-child(n+3){width:40px}.game{border-radius:15px}}</style></head>
<body><header class="top"><div class="wrap"><div class="nav"><div class="logo">KBO LIVE</div><span class="pill">● LIVE DATA</span></div><div class="tabs"><button class="tab on" id="tGames">오늘 경기</button><button class="tab" id="tRank">순위</button></div></div></header>
<main class="wrap"><section id="gamesPage"><h1>오늘의 KBO</h1><p class="sub" id="date"></p><div id="games">불러오는 중…</div></section><section id="rankPage" style="display:none"><h1>KBO 순위</h1><p class="sub">2026 시즌</p><div class="card"><table class="rank"><thead><tr><th>순위</th><th>팀</th><th>승</th><th>패</th><th>무</th><th>게임차</th></tr></thead><tbody id="rank">불러오는 중…</tbody></table></div></section><section id="detail" style="display:none"></section></main>
<script>
const $=s=>document.querySelector(s), api=p=>fetch('/.netlify/functions/kbo?path='+encodeURIComponent(p)).then(async r=>{let j=await r.json();if(!r.ok)throw Error('API '+r.status);return j.result??j});
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const val=(o,...keys)=>{for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k]}return null};
function score(g,side){return val(g,side+'TeamScore',side+'Score',side+'ScoreValue',side+'TeamResultScore')??'-'}
function status(g){let s=String(val(g,'statusCode','status')||'').toUpperCase();return s.includes('RESULT')||s.includes('END')||s.includes('FINAL')?'경기 종료':s.includes('START')||s.includes('LIVE')?'● LIVE':'경기 예정'}
async function games(){let d=today();$('#date').textContent=d.replaceAll('-','.')+' · 5초 자동 갱신';try{let r=await api(`/schedule/games?upperCategoryId=kbaseball&fromDate=${d}&toDate=${d}`);let a=r.games||[];if(!a.length){$('#games').innerHTML='<div class="card empty">오늘 경기가 없습니다.</div>';return}$('#games').innerHTML=a.map(g=>`<article class="card game" onclick="detail('${g.gameId}')"><div class="status">${status(g)==='● LIVE'?'<span class="live">● LIVE</span>':status(g)}</div><div class="teams"><div class="team"><b>${val(g,'awayTeamName','awayName')||'-'}</b><div class="score">${score(g,'away')}</div></div><div class="vs">VS</div><div class="team"><b>${val(g,'homeTeamName','homeName')||'-'}</b><div class="score">${score(g,'home')}</div></div></div><div class="meta">${val(g,'stadium')||''} ${val(g,'startTime')||''}</div></article>`).join('')}catch(e){$('#games').innerHTML='<div class="card error">경기 데이터를 불러오지 못했습니다.<br>'+e.message+'</div>'}}
async function standings(){try{let r=await api('/statistics/categories/kbo/seasons/2026/teams');let a=r.seasonTeamStats||r.teams||r.teamStats||r.data||[];if(!Array.isArray(a))a=Object.values(a);$('#rank').innerHTML=a.map((x,i)=>`<tr><td>${val(x,'ranking','rank','rankNo')??i+1}</td><td><b>${val(x,'teamName','name')||'-'}</b></td><td>${val(x,'winGameCount','wins','winCount','win')??'-'}</td><td>${val(x,'loseGameCount','losses','loseCount','loss')??'-'}</td><td>${val(x,'drawnGameCount','draws','drawCount','draw')??'-'}</td><td>${val(x,'gameBehind','gamesBehind','gameDifference')??'-'}</td></tr>`).join('')||'<tr><td colspan="6">순위 데이터가 없습니다.</td></tr>'}catch(e){$('#rank').innerHTML='<tr><td colspan="6" class="error">순위 데이터를 불러오지 못했습니다.</td></tr>'}}
async function detail(id){$('#gamesPage').style.display='none';$('#rankPage').style.display='none';$('#detail').style.display='block';$('#detail').innerHTML='<button class="back" onclick="back()">← 경기 목록</button><div class="card">불러오는 중…</div>';try{let r=await api(`/schedule/games/${id}/relay`),d=r.currentGameState||r.game||r;let g=await api(`/schedule/games/${id}`);g=g.game||g;$('#detail').innerHTML=`<button class="back" onclick="back()">← 경기 목록</button><div class="card"><h2>${val(g,'awayTeamName')||'원정'} ${val(d,'awayScore')??score(g,'away')} : ${val(d,'homeScore')??score(g,'home')} ${val(g,'homeTeamName')||'홈'}</h2><p class="sub">${val(g,'stadium')||''}</p><hr><p>경기 상태: ${val(g,'statusCode','status')||'-'}</p><p>실시간 데이터: 연결됨</p></div>`}catch(e){$('#detail').innerHTML='<button class="back" onclick="back()">← 경기 목록</button><div class="card error">상세 데이터를 불러오지 못했습니다.</div>'}}
function back(){$('#detail').style.display='none';$('#gamesPage').style.display='block'}
$('#tGames').onclick=()=>{location.reload()};$('#tRank').onclick=()=>{$('#gamesPage').style.display='none';$('#detail').style.display='none';$('#rankPage').style.display='block';$('#tGames').classList.remove('on');$('#tRank').classList.add('on');standings()};games();setInterval(games,5000);
</script></body></html>
